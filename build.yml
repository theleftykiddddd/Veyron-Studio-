name: Build Veyron Studio (Windows / GD 2.2091)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyron-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 .geode
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with the Geode SDK declared in mod.json
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release
          use-lto: false

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Studio-Windows-GD-2.2091
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
