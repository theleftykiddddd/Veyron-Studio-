name: Veyron Studio - Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veyron Studio for GD 2.2091
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Corregir automáticamente la versión de Geode
      - name: Normalize Geode version in mod.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $modPath = Join-Path $env:GITHUB_WORKSPACE "mod.json"

          if (-not (Test-Path -LiteralPath $modPath)) {
              throw "ERROR: mod.json was not found in the repository root."
          }

          $mod = Get-Content -LiteralPath $modPath -Raw | ConvertFrom-Json

          if ($null -eq $mod.PSObject.Properties["geode"]) {
              throw "ERROR: mod.json does not contain a geode version."
          }

          $geodeVersion = ([string]$mod.geode).Trim()

          if ($geodeVersion.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
              $geodeVersion = $geodeVersion.Substring(1)
          }

          if ($geodeVersion -ne "6.0.0-alpha.1") {
              throw "ERROR: Expected Geode 6.0.0-alpha.1, but found '$geodeVersion'."
          }

          $mod.geode = $geodeVersion

          $normalizedJson = $mod | ConvertTo-Json -Depth 100
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::WriteAllText(
              $modPath,
              $normalizedJson + [Environment]::NewLine,
              $utf8NoBom
          )

          Write-Host "Geode version successfully normalized:"
          Write-Host $mod.geode

      # 3. Compilar Veyron Studio
      - name: Build Veyron Studio
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: Win64
          build-config: Release
          use-lto: "false"

      # 4. Guardar el archivo .geode generado
      - name: Upload compiled Geode package
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Studio-Windows-GD-2.2091
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
